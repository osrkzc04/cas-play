services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cas_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      ENVIRONMENT: production
      PROJECT_NAME: ${PROJECT_NAME}
      API_V1_PREFIX: /api/v1
      # Base de datos: POSTGRES_HOST apunta al servicio, no a localhost.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      PASSWORD_RESET_TOKEN_EXPIRE_MINUTES: 15
      CORS_ORIGINS: ${CORS_ORIGINS}
      # PUBLIC_BASE_URL: dominio del backend, raíz para servir media (portadas,
      # fotos de instructor).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # FRONTEND_BASE_URL: dominio del frontend; el QR de los certificados apunta
      # a {FRONTEND_BASE_URL}/verify/{code} (página pública de validación).
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      MEDIA_ROOT: storage
      EMAILS_ENABLED: "true"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_TLS: "true"
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      FIRST_ADMIN_FIRST_NAME: ${FIRST_ADMIN_FIRST_NAME}
      FIRST_ADMIN_LAST_NAME: ${FIRST_ADMIN_LAST_NAME}
    volumes:
      - cas_storage_prod:/app/storage
    ports:
      # HTTP plano publicado en el host Dokploy. El TLS termina en Plesk
      # (apicas.kamaycode.ec), que hace proxy hacia http://186.4.191.28:${API_PORT}.
      - "${API_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_API_URL se inyecta en build-time (Vite lo compila en el bundle).
        # Cambiar el dominio del backend obliga a reconstruir el frontend.
        VITE_API_URL: ${VITE_API_URL}
    restart: always
    ports:
      # El TLS termina en Plesk (cas.kamaycode.ec), que hace proxy hacia
      # http://186.4.191.28:${APP_PORT}.
      - "${APP_PORT}:80"

volumes:
  cas_postgres_prod_data:
  cas_storage_prod:

networks:
  # Red privada backend <-> postgres (sin exposición al host).
  internal:
