<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/cas-logo-icon-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Culinary Arts School</title>
    <script>
      // Aplica el tema antes de montar React para evitar parpadeo claro.
      (function () {
        try {
          var stored = localStorage.getItem("cas-theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
